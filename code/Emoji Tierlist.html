<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Emoji Tierlist</title>
    <meta name="claude:viewport-fit-sides" content="cover" />

    <style>
      /*
  LAYOUT: 9:16 portrait
  56% Tierlist — 12% RAUS — Ladebalken — Evaluation Stage — Switch
  Alle Karten liegen absolut in #cards und werden von layout() platziert.
*/

      :root {
        --ink: #000000;
        --paper: #ffffff;
        --neon: #ffe500;
        --hot: #ff2d78;
        --cyan: #00c2ff;

        --tier-s: #ff0a54;
        --tier-a: #00d95f;
        --tier-b: #ff6b00;
        --tier-c: #ffe500;
        --tier-d: #00c2ff;

        --f-display: Impact, "Arial Black", sans-serif;
        --f-mono: "Courier New", monospace;

        --rail: min(9.5vh, 20vw);

        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--f-display);
        -webkit-font-smoothing: antialiased;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        padding-left: max(0px, env(safe-area-inset-left, 0px));
        padding-right: max(0px, env(safe-area-inset-right, 0px));
      }

      /* ═══════════════════════════════
   TIERLIST
═══════════════════════════════ */

      #tierlist-section {
        flex: 0 0 56%;
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: var(--ink);
        overflow: hidden;
      }

      .tier-row {
        flex: 1 1 0;
        display: flex;
        align-items: stretch;
        min-height: 0;
      }

      .tier-row.t-S {
        background: var(--tier-s);
      }
      .tier-row.t-A {
        background: var(--tier-a);
      }
      .tier-row.t-B {
        background: var(--tier-b);
      }
      .tier-row.t-C {
        background: var(--tier-c);
      }
      .tier-row.t-D {
        background: var(--tier-d);
      }

      .tier-label-col {
        flex: 0 0 min(11vw, 7vh);
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ink);
        font-size: min(9vw, 6vh);
        transform: rotate(-4deg) scale(1.08);
        z-index: 1;
      }

      .tier-row.t-S .tier-label-col {
        color: var(--tier-s);
      }
      .tier-row.t-A .tier-label-col {
        color: var(--tier-a);
      }
      .tier-row.t-B .tier-label-col {
        color: var(--tier-b);
      }
      .tier-row.t-C .tier-label-col {
        color: var(--tier-c);
      }
      .tier-row.t-D .tier-label-col {
        color: var(--tier-d);
      }

      .tier-row.receiving {
        animation: rowFlash 1.1s steps(4) forwards;
      }

      @keyframes rowFlash {
        0%,
        50% {
          filter: invert(1);
        }
        25%,
        100% {
          filter: none;
        }
      }

      .tier-items {
        flex: 1;
        min-width: 0;
        margin: 6px calc(var(--rail) + 8px) 6px 8px;
      }

      /* Spur rechts: hier sucht der Ghost seinen Platz */
      #rail {
        position: absolute;
        top: 0;
        right: 0;
        width: var(--rail);
        height: 68%;
        background: rgba(0, 0, 0, 0.45);
        border-left: 3px dashed var(--paper);
        z-index: 2;
      }

      /* ── RAUS ── */
      .pile-row {
        display: flex;
        align-items: stretch;
        min-height: 0;
        border-top: 4px solid var(--ink);
      }

      #raus-row {
        flex: 0 0 12%;
        background: repeating-linear-gradient(
          -45deg,
          #2a2a2a,
          #2a2a2a 14px,
          #171717 14px,
          #171717 28px
        );
      }

      .pile-row .tier-label-col {
        color: var(--paper);
        font-size: min(4.2vw, 2.6vh);
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        letter-spacing: 0.08em;
      }

      /* ── Switch: eine Taste pro Liste ── */
      #mode-switch {
        flex: 0 0 4.5vh;
        display: flex;
        gap: 4px;
        background: var(--ink);
        border-top: 4px solid var(--ink);
      }

      #mode-switch button {
        flex: 1 1 0;
        min-width: 0;
        border: 0;
        background: #333;
        color: var(--paper);
        font-family: var(--f-display);
        font-size: min(2.4vh, 4.6vw);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        cursor: pointer;
      }

      #mode-switch button[aria-pressed="true"] {
        background: var(--neon);
        color: var(--ink);
      }

      /* ── Ladebalken: läuft von rechts nach links ab ── */
      #load-track {
        flex: 0 0 1.6vh;
        background: var(--ink);
        border-top: 3px solid var(--ink);
      }

      #load-bar {
        height: 100%;
        background: var(--paper);
        transform: scaleX(0);
        transform-origin: left center;
      }

      /* ── Karten ── */
      #cards {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      .card {
        position: absolute;
        top: 0;
        left: 0;
        transition:
          transform 0.9s cubic-bezier(0.34, 1.4, 0.64, 1),
          width 0.65s,
          height 0.65s,
          font-size 0.65s;
        will-change: transform;
      }

      .card.no-anim {
        transition: none;
      }

      .card-face {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        user-select: none;
        position: relative;
        background: var(--paper);
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
      }

      .card-emoji.poster {
        width: 100%;
        height: 100%;
      }
      .card-emoji.poster img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .card-score {
        position: absolute;
        bottom: -3px;
        right: -3px;
        font-family: var(--f-display);
        font-size: 0.34em;
        color: var(--neon);
        background: var(--ink);
        padding: 0.1em 0.3em;
        font-variant-numeric: tabular-nums;
      }

      /* Abgestiegene Karten: kleiner Haufen ohne Score */
      .card.in-x .card-face {
        border-width: 1px;
        box-shadow: none;
      }
      .card.in-x .card-score {
        display: none;
      }

      /* Ghost: sucht noch seinen Platz */
      .card.ghost {
        z-index: 5;
      }
      .card.ghost .card-face {
        background: rgba(255, 255, 255, 0.18);
        border: 3px dashed var(--paper);
        box-shadow: none;
        animation: ghostShake 0.36s steps(2) infinite;
      }
      .card.ghost .card-emoji {
        opacity: 0.5;
      }
      .card.ghost .card-score {
        background: var(--paper);
        color: var(--ink);
      }

      @keyframes ghostShake {
        from {
          transform: translate(-1px, 1px) rotate(-1.5deg);
        }
        to {
          transform: translate(1px, -1px) rotate(1.5deg);
        }
      }

      .card.stamp .card-face {
        animation: stamp 0.55s cubic-bezier(0.3, 1.8, 0.6, 1);
      }
      .card.bump .card-face {
        animation: bump 0.65s ease-out;
      }

      @keyframes stamp {
        from {
          transform: scale(1.7) rotate(-10deg);
        }
        to {
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes bump {
        30% {
          transform: scale(1.18) rotate(5deg);
        }
      }

      /* +/- Anzeige der Live-Anpassung */
      .card-pop {
        position: absolute;
        top: -0.2em;
        left: 50%;
        font-family: var(--f-display);
        font-size: max(20px, 3vh);
        padding: 0 0.25em;
        border: 2px solid var(--ink);
        z-index: 6;
        white-space: nowrap;
        animation: popUp 1.6s ease-out forwards;
      }
      .card-pop.up {
        background: #00ff66;
        color: var(--ink);
      }
      .card-pop.down {
        background: #ff0033;
        color: var(--paper);
      }

      @keyframes popUp {
        from {
          transform: translate(-50%, 0) rotate(-6deg);
          opacity: 1;
        }
        70% {
          opacity: 1;
        }
        to {
          transform: translate(-50%, -1.2em) rotate(-6deg);
          opacity: 0;
        }
      }

      /* ═══════════════════════════════
   STAGE
═══════════════════════════════ */

      #stage {
        flex: 1 1 0;
        display: flex;
        flex-direction: row-reverse;
        background: #111;
        border-top: 6px solid var(--neon);
        overflow: hidden;
        min-height: 0;
      }

      /* Rechts: grosses Emoji */
      #emoji-col {
        flex: 0 0 34%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.6vh;
        padding: 1vh 0;
        min-width: 0;
      }

      #big-emoji {
        font-size: min(14vh, 30vw);
        line-height: 1;
        user-select: none;
        will-change: transform;
      }

      #big-emoji .poster img {
        display: block;
        height: min(14vh, 30vw);
        border: 3px solid var(--paper);
      }

      #big-emoji.evaluating {
        animation: emPulse 0.5s steps(2) infinite alternate;
      }

      @keyframes emPulse {
        from {
          transform: scale(1) rotate(-3deg);
        }
        to {
          transform: scale(1.07) rotate(3deg);
        }
      }

      #big-emoji.reveal {
        animation: emReveal 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes emReveal {
        from {
          transform: scale(0.2) rotate(-20deg);
          opacity: 0;
        }
        to {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
      }

      #current-name {
        font-family: var(--f-mono);
        font-weight: 700;
        font-size: min(1.3vh, 2.7vw);
        text-transform: uppercase;
        text-align: center;
        padding: 0 6px;
        line-height: 1.1;
        max-height: 2.2em;
        overflow: hidden;
      }

      #tier-preview {
        flex: 0 0 auto;
        align-self: center;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .tp-badge {
        width: min(3.2vh, 5.4vw);
        height: min(3.2vh, 5.4vw);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: min(2.4vh, 4vw);
        color: var(--ink);
        opacity: 0.25;
      }

      .tp-badge.predicted {
        opacity: 1;
        outline: 3px solid var(--paper);
        transform: scale(1.15);
        z-index: 1;
      }

      .tp-badge[data-t="S"] {
        background: var(--tier-s);
      }
      .tp-badge[data-t="A"] {
        background: var(--tier-a);
      }
      .tp-badge[data-t="B"] {
        background: var(--tier-b);
      }
      .tp-badge[data-t="C"] {
        background: var(--tier-c);
      }
      .tp-badge[data-t="D"] {
        background: var(--tier-d);
      }
      .tp-badge[data-t="X"] {
        background: #888;
      }

      /* Links: Scores */
      #data-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0.6vh 2.4vw;
        gap: 0.6vh;
        overflow: hidden;
        min-width: 0;
      }

      #stage-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex: 0 0 auto;
      }

      #stage-status {
        font-size: min(2.4vh, 4.4vw);
        color: var(--neon);
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #score-bars {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.5vh;
        min-height: 0;
      }

      .score-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.2vh 8px;
      }

      .score-label {
        flex: 0 0 100%;
        font-family: var(--f-mono);
        font-weight: 700;
        font-size: min(1.4vh, 2.7vw);
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .score-track {
        flex: 1;
        height: 1.3vh;
        background: var(--ink);
        border: 2px solid var(--paper);
        overflow: hidden;
      }

      .score-fill {
        height: 100%;
        width: 0%;
        transition: width 1.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .score-fill.f0 {
        background: var(--hot);
      }
      .score-fill.f1 {
        background: var(--cyan);
      }
      .score-fill.f2 {
        background: var(--neon);
      }

      .score-num {
        flex: 0 0 3ch;
        font-size: min(2.2vh, 4vw);
        line-height: 1;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      #total-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 3px solid var(--paper);
        padding-top: 0.4vh;
        flex: 0 0 auto;
      }

      #total-label {
        font-family: var(--f-mono);
        font-weight: 700;
        font-size: min(1.4vh, 2.7vw);
        text-transform: uppercase;
      }

      #total-score {
        font-size: min(4.4vh, 10vw);
        line-height: 1;
        color: var(--neon);
        font-variant-numeric: tabular-nums;
      }
    </style>

    <div id="app">
      <!-- ══ TIERLIST ══ -->
      <div id="tierlist-section">
        <div class="tier-row t-S" id="row-S">
          <div class="tier-label-col">S</div>
          <div class="tier-items" id="items-S"></div>
        </div>
        <div class="tier-row t-A" id="row-A">
          <div class="tier-label-col">A</div>
          <div class="tier-items" id="items-A"></div>
        </div>
        <div class="tier-row t-B" id="row-B">
          <div class="tier-label-col">B</div>
          <div class="tier-items" id="items-B"></div>
        </div>
        <div class="tier-row t-C" id="row-C">
          <div class="tier-label-col">C</div>
          <div class="tier-items" id="items-C"></div>
        </div>
        <div class="tier-row t-D" id="row-D">
          <div class="tier-label-col">D</div>
          <div class="tier-items" id="items-D"></div>
        </div>
      </div>

      <!-- ══ RAUS ══ -->
      <div id="raus-row" class="pile-row">
        <div class="tier-label-col">RAUS</div>
        <div class="tier-items" id="items-X"></div>
      </div>

      <!-- ══ LADEBALKEN ══ -->
      <div id="load-track"><div id="load-bar"></div></div>

      <!-- ══ STAGE ══ -->
      <div id="stage">
        <!-- Emoji + Tier-Preview -->
        <div id="emoji-col">
          <div id="big-emoji">—</div>
          <div id="current-name">—</div>
        </div>

        <!-- Tier-Anzeige -->
        <div id="tier-preview">
          <div class="tp-badge" data-t="S">S</div>
          <div class="tp-badge" data-t="A">A</div>
          <div class="tp-badge" data-t="B">B</div>
          <div class="tp-badge" data-t="C">C</div>
          <div class="tp-badge" data-t="D">D</div>
          <div class="tp-badge" data-t="X">X</div>
        </div>

        <!-- Scores -->
        <div id="data-col">
          <div id="stage-header">
            <span id="stage-status">Bereit</span>
          </div>

          <div id="score-bars">
            <div class="score-row">
              <div class="score-label" id="lbl-0">—</div>
              <div class="score-track">
                <div class="score-fill f0" id="bar-0"></div>
              </div>
              <div class="score-num" id="val-0">—</div>
            </div>
            <div class="score-row">
              <div class="score-label" id="lbl-1">—</div>
              <div class="score-track">
                <div class="score-fill f1" id="bar-1"></div>
              </div>
              <div class="score-num" id="val-1">—</div>
            </div>
            <div class="score-row">
              <div class="score-label" id="lbl-2">—</div>
              <div class="score-track">
                <div class="score-fill f2" id="bar-2"></div>
              </div>
              <div class="score-num" id="val-2">—</div>
            </div>
          </div>

          <div id="total-row">
            <span id="total-label">Gesamtscore</span>
            <span id="total-score">—</span>
          </div>
        </div>
      </div>

      <!-- ══ SWITCH ══ -->
      <div id="mode-switch"></div>

      <!-- ══ GHOST-SPUR ══ -->
      <div id="rail"></div>

      <!-- ══ KARTEN ══ -->
      <div id="cards"></div>
    </div>

          ],
          aspect: 310 / 446,
          items: (window.FILME || []).map((f) => ({
            name: `${f.title} (${f.year})`,
            image: f.image,
          })),
        },
        {
          id: "emojis",
          label: "Emojis",
          keys: [
            "Missverständnispotenzial",
            "Tippgeschwindigkeit",
            "Diplomatische Verwendbarkeit",
          ],
          aspect: 1,
          items: EMOJIS.map(([emoji, name]) => ({ name, emoji })),
        },
        {
          id: "personen",
          label: "Personen",
          keys: [
            "Kaffeemaschinen-Autorität",
            "Türklinken-Souveränität",
            "Laserpointer-Eleganz",
          ],
          aspect: 2 / 3,
          items: (window.PERSONEN || []).map((p) => ({
            name: p.name,
            image: p.image,
          })),
        },
      ].filter((l) => l.items.length);

      // Score-Grenzen der Tiers, die Plätze sind unbegrenzt. Unter 10 geht es endgültig in RAUS.
      const TIERS = [
        { id: "S", min: 90 },
        { id: "A", min: 70 },
        { id: "B", min: 50 },
        { id: "C", min: 30 },
        { id: "D", min: 10 },
      ];
      const SPREAD = 20; // wie weit die drei Werte eines Eintrags auseinanderliegen

      const REVEAL_MS = 2200; // Zeit pro aufgedecktem Wert
      const SETTLE_MS = 1200; // kurzes Verharren, bevor der Ghost gesetzt wird
      const STEP_MS = 700; // so oft sucht der Ghost einen neuen Platz
      const NOISE = 18; // Unsicherheit, solange noch alle Werte fehlen
      const DRIFT_MAX = 15; // maximale Live-Anpassung
      const RESTART_MS = 6000; // so lange steht die leere Liste, bevor sie neu beginnt

      // ── State ──
      let entries = [],
        placed = [],
        queue = [];
      let list = null,
        generation = 0;

      // Wie setTimeout, verfällt aber, sobald die Liste gewechselt wurde
      function later(fn, ms) {
        const gen = generation;
        setTimeout(() => {
          if (gen === generation) fn();
        }, ms);
      }

      function calcScore(v) {
        return Math.round((v[0] + v[1] + v[2]) / 3);
      }
      function clamp(v) {
        return Math.max(1, Math.min(100, Math.round(v)));
      }

      // Ein gemeinsamer Grundwert hält den Durchschnitt über die ganze Skala verteilt, auch bis 100
      function rollValues() {
        const base = Math.random() * 110;
        return [0, 1, 2].map(() =>
          clamp(base + (Math.random() * 2 - 1) * SPREAD),
        );
      }

      function loadList(next) {
        generation++;
        list = next;
        document
          .querySelectorAll("#mode-switch button")
          .forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.list === list.id),
          );
        resetStage();
        document.getElementById("cards").innerHTML = "";
        entries = list.items.map((item, i) => ({
          ...item,
          id: i,
          v: rollValues(),
          score: 0,
          prov: 0,
          ghost: false,
          tier: null,
          shown: null,
          card: null,
        }));
        placed = [];
        queue = [...entries].sort(() => Math.random() - 0.5).map((e) => e.id);
        later(runNext, 600);
      }

      function resetStage() {
        const big = document.getElementById("big-emoji");
        big.classList.remove("evaluating", "reveal");
        big.textContent = "—";
        document.getElementById("current-name").textContent = "—";
        [0, 1, 2].forEach((i) => {
          document.getElementById(`bar-${i}`).style.width = "0%";
          document.getElementById(`val-${i}`).textContent = "—";
          document.getElementById(`lbl-${i}`).textContent = list.keys[i];
        });
        document.getElementById("total-score").textContent = "—";
        const bar = document.getElementById("load-bar");
        bar.style.transition = "none";
        bar.style.transform = "scaleX(0)";
        setPreview(null);
        setStatus("Bereit");
      }

      function buildSwitch() {
        const box = document.getElementById("mode-switch");
        LISTS.forEach((l) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = l.label;
          b.dataset.list = l.id;
          b.addEventListener("click", () => {
            if (l !== list) loadList(l);
          });
          box.appendChild(b);
        });
      }

      function init() {
        // ?liste=emojis wählt die Liste, mit der die Seite startet
        const wanted = LISTS.find(
          (l) => l.id === new URLSearchParams(location.search).get("liste"),
        );
        window.addEventListener("resize", layout);
        buildSwitch();
        loadList(wanted || LISTS[0]);
        setTimeout(driftTick, 2000);
      }

      // ── Layout: Der Score allein bestimmt das Tier ──
      function ranking() {
        return placed
          .filter((e) => !e.ghost)
          .sort((a, b) => b.score - a.score || a.id - b.id);
      }

      function tierOfScore(score) {
        for (const t of TIERS) if (score >= t.min) return t.id;
        return "X";
      }

      function buckets() {
        const rows = { S: [], A: [], B: [], C: [], D: [], X: [] };
        ranking().forEach((e) => rows[e.tier].push(e));
        return rows;
      }

      function listed() {
        const rows = buckets();
        return TIERS.flatMap((t) => rows[t.id]);
      }

      // grösste Kartenhöhe, bei der n Stück in die Fläche passen
      function fitSize(w, h, n, gap) {
        for (let s = Math.floor(h); s > 8; s--) {
          const cols = Math.floor((w + gap) / (s * list.aspect + gap));
          if (cols > 0 && Math.ceil(n / cols) * (s + gap) - gap <= h) return s;
        }
        return 8;
      }

      function placeRow(id, cards, gap) {
        if (!cards.length) return;
        const origin = document.getElementById("app").getBoundingClientRect();
        const box = document.getElementById(id).getBoundingClientRect();
        // RAUS bleibt ein kleiner Haufen, auch wenn erst wenige drin liegen
        const size = Math.min(
          fitSize(box.width, box.height, cards.length, gap),
          id === "items-X" ? box.height / 2 : Infinity,
        );
        const cols = Math.floor((box.width + gap) / (size * list.aspect + gap));
        cards.forEach((e, i) => {
          const x =
            box.left - origin.left + (i % cols) * (size * list.aspect + gap);
          const y = box.top - origin.top + Math.floor(i / cols) * (size + gap);
          placeCard(e, x, y, size);
        });
      }

      function layout() {
        Object.entries(buckets()).forEach(([tier, cards]) => {
          placeRow(`items-${tier}`, cards, tier === "X" ? 2 : 8);
          cards.forEach((e) => {
            if (e.shown && e.shown !== tier) flag(e.card, "bump", 650);
            e.shown = tier;
            e.card.classList.toggle("in-x", tier === "X");
          });
        });

        placed.filter((e) => e.ghost).forEach(placeGhost);
      }

      // Der Ghost fährt die Spur entlang seinem Score hoch und runter, die Liste bleibt unberührt
      function placeGhost(g) {
        const origin = document.getElementById("app").getBoundingClientRect();
        const rail = document.getElementById("rail").getBoundingClientRect();
        const band = tierOfScore(g.prov);
        const i = TIERS.findIndex((t) => t.id === band);
        const hi =
          i === 0
            ? 100
            : i < 0
              ? TIERS[TIERS.length - 1].min
              : TIERS[i - 1].min;
        const lo = i < 0 ? 1 : TIERS[i].min;
        const row = document
          .getElementById(i < 0 ? "raus-row" : `row-${band}`)
          .getBoundingClientRect();

        const size = Math.min(rail.width / list.aspect, row.height) - 8;
        const x =
          rail.left - origin.left + (rail.width - size * list.aspect) / 2;
        const y =
          row.top -
          origin.top +
          4 +
          ((hi - g.prov) / (hi - lo)) * (row.height - size - 8);
        placeCard(g, x, y, size);
      }

      function placeCard(e, x, y, size) {
        const s = e.card.style;
        s.width = size * list.aspect + "px";
        s.height = size + "px";
        s.fontSize = Math.round(size * list.aspect * 0.68) + "px";
        s.transform = `translate(${x}px,${y}px) rotate(${e.card.dataset.rot}deg)`;
      }

      function flag(el, cls, ms) {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
        setTimeout(() => el.classList.remove(cls), ms);
      }

      // Emoji als Text, alles andere als Bild
      function fillMedia(el, e) {
        el.textContent = "";
        if (!e.image) {
          el.textContent = e.emoji;
          return;
        }
        const holder = el.classList.contains("card-emoji")
          ? el
          : el.appendChild(document.createElement("div"));
        holder.classList.add("poster");
        const img = document.createElement("img");
        img.src = e.image;
        img.alt = e.name;
        holder.appendChild(img);
      }

      function buildCard(e) {
        const el = document.createElement("div");
        el.className = "card no-anim";
        el.dataset.rot = (Math.random() * 10 - 5).toFixed(1);
        el.innerHTML =
          '<div class="card-face"><span class="card-emoji"></span><div class="card-score"></div></div>';
        fillMedia(el.querySelector(".card-emoji"), e);
        e.card = el;
        document.getElementById("cards").appendChild(el);
        // Start auf dem grossen Element, von dort fliegt der Ghost auf die Spur
        const origin = document.getElementById("app").getBoundingClientRect();
        const r = document.getElementById("big-emoji").getBoundingClientRect();
        placeCard(e, r.left - origin.left, r.top - origin.top, r.height);
        void el.offsetWidth;
        el.classList.remove("no-anim");
        placed.push(e);
      }

      function setCardScore(e, value) {
        e.card.querySelector(".card-score").textContent = value;
      }

      // ── Auswertung: Der Ghost folgt dem vorläufigen Score ──
      function runNext() {
        // Jeder Eintrag wird genau einmal ausgewertet, danach ändert ihn nur noch die Live-Anpassung
        const e = entries[queue.shift()];

        showEmoji(e);
        e.prov = 50;
        e.ghost = true;
        buildCard(e);
        e.card.classList.add("ghost");

        const started = performance.now();
        const total = REVEAL_MS * 3;
        startLoadBar(total + SETTLE_MS);
        later(() => commit(e), total + SETTLE_MS);

        e.v.forEach((v, i) =>
          later(() => {
            document.getElementById(`bar-${i}`).style.width = v + "%";
            countUp(document.getElementById(`val-${i}`), 0, v, REVEAL_MS * 0.7);
          }, REVEAL_MS * i),
        );

        const step = () => {
          const elapsed = performance.now() - started;
          const known = Math.min(3, Math.floor(elapsed / REVEAL_MS));
          const rest = 3 - known;
          if (rest > 0) {
            const guess =
              (e.v.slice(0, known).reduce((a, b) => a + b, 0) + 50 * rest) / 3;
            e.prov = clamp(
              guess + ((Math.random() * 2 - 1) * NOISE * rest) / 3,
            );
          } else {
            e.prov = calcScore(e.v);
          }
          setCardScore(e, e.prov);
          document.getElementById("total-score").textContent = e.prov;
          layout();
          const band = tierOfScore(e.prov);
          setPreview(band);
          setStatus(band === "X" ? "Raus?" : `Tier ${band}?`);
          if (elapsed < total) later(step, STEP_MS);
        };
        step();
      }

      function commit(e) {
        e.score = calcScore(e.v);
        e.ghost = false;
        e.tier = tierOfScore(e.score);
        e.card.classList.remove("ghost");
        setCardScore(e, e.score);
        flag(e.card, "stamp", 550);
        layout();

        document.getElementById("big-emoji").classList.remove("evaluating");
        setPreview(e.tier);
        if (e.tier !== "X") {
          setStatus(`Tier ${e.tier}!`);
          flag(document.getElementById(`row-${e.tier}`), "receiving", 1100);
        } else {
          setStatus("Raus!");
        }

        later(queue.length ? runNext : finish, 2000 + Math.random() * 2500);
      }

      // Alle sind einmal durch, ab jetzt läuft nur noch die Live-Anpassung
      function finish() {
        resetStage();
        setStatus("Alle geranked");
        restartIfEmpty();
      }

      // Sind alle ausgewertet und in RAUS, beginnt die Liste von vorn, mit neuen Werten
      function restartIfEmpty() {
        if (queue.length || placed.some((e) => e.ghost) || listed().length)
          return;
        setStatus("Alle raus");
        later(() => loadList(list), RESTART_MS);
      }

      function startLoadBar(ms) {
        const bar = document.getElementById("load-bar");
        bar.style.transition = "none";
        bar.style.transform = "scaleX(1)";
        void bar.offsetWidth;
        bar.style.transition = `transform ${ms}ms linear`;
        bar.style.transform = "scaleX(0)";
      }

      function showEmoji(e) {
        const el = document.getElementById("big-emoji");
        document.getElementById("current-name").textContent = e.name;
        el.classList.remove("evaluating", "reveal");
        void el.offsetWidth;
        fillMedia(el, e);
        el.classList.add("reveal");
        later(() => {
          el.classList.remove("reveal");
          el.classList.add("evaluating");
        }, 650);
        [0, 1, 2].forEach((i) => {
          document.getElementById(`bar-${i}`).style.width = "0%";
          document.getElementById(`val-${i}`).textContent = "—";
          document.getElementById(`lbl-${i}`).textContent = list.keys[i];
        });
      }

      function countUp(el, from, to, dur) {
        const start = performance.now();
        const gen = generation;
        (function step(now) {
          if (gen !== generation) return;
          const t = Math.min((now - start) / dur, 1);
          const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          el.textContent = Math.round(from + (to - from) * eased);
          if (t < 1) requestAnimationFrame(step);
          else el.textContent = to;
        })(performance.now());
      }

      function setStatus(text) {
        document.getElementById("stage-status").textContent = text;
      }

      function setPreview(tier) {
        document
          .querySelectorAll(".tp-badge")
          .forEach((b) =>
            b.classList.toggle("predicted", b.dataset.t === tier),
          );
      }

      // ── Live-Anpassung der bereits gerankten Elemente ──
      function driftTick() {
        const top = listed();
        if (top.length) {
          const e = top[Math.floor(Math.random() * top.length)];
          const delta =
            (1 + Math.floor(Math.random() * DRIFT_MAX)) *
            (Math.random() < 0.5 ? -1 : 1);
          const before = e.score;
          e.v = e.v.map((v) => clamp(v + delta));
          e.score = calcScore(e.v);
          setCardScore(e, e.score);
          e.tier = tierOfScore(e.score);
          showPop(e, e.score - before);
          layout();
          restartIfEmpty();
        }
        setTimeout(driftTick, 3000 + Math.random() * 2000);
      }

      function showPop(e, change) {
        if (!change) return;
        const pop = document.createElement("div");
        pop.className = "card-pop " + (change > 0 ? "up" : "down");
        pop.textContent = (change > 0 ? "+" : "") + change;
        e.card.appendChild(pop);
        setTimeout(() => pop.remove(), 1600);
      }

      init();
    </script>
  </body>
</html>
